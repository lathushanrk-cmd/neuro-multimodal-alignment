[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-multimodal-alignment"
version = "0.5.0"
description = "Cross-validated alignment of paired neuroscience representations"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Lathushan RK"}]
keywords = ["neuroscience", "RSA", "CCA", "multimodal", "representational-alignment"]
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "matplotlib>=3.7"]
classifiers = ["Programming Language :: Python :: 3", "Intended Audience :: Science/Research", "Development Status :: 3 - Alpha"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "build>=1", "ruff>=0.5", "nbformat>=5", "nbclient>=0.10"]
realdata = ["mne>=1.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
